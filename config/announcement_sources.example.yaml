# Copy to config/announcement_sources.yaml and edit.
#
# Before adding a REAL site: read its terms of use and robots.txt, and prefer an official
# API or RSS feed if it has one. Keep the interval slow (the default is 5 minutes).
# Selectors are CSS selectors; find them with your browser's "Inspect" tool.

- name: kraken
  url: "https://blog.kraken.com/category/product/listings"
  item_selector: "article"              # CSS selector for each post card
  title_selector: "h2 a, h3 a"         # CSS selector for the title
  link_selector: "h2 a, h3 a"          # CSS selector for the link
  date_selector: "time"                # optional date selector
  date_attribute: "datetime"

