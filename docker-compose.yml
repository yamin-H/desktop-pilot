services:
  db:
    # timescaledb-ha bundles TimescaleDB AND pgvector (the plain image has no pgvector)
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: deskpilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg-data:
  redis-data: